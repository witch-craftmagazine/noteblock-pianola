
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <!-- Primary Meta Tags -->
  <title>Noteblock Pianola</title>
  <meta name="title" content="Noteblock Pianola" />
  <meta name="description" content="🎹🍺 where everybody knows your name 🎵🎶" />

  <!-- Theme color (helps Discord embed accent bar + some platforms) -->
  <meta name="theme-color" content="#2b2b2b" />

  <!-- Open Graph / Facebook / Discord -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://witch-craftmagazine.github.io/noteblock-pianola/" />
  <meta property="og:site_name" content="Noteblock Pianola" />
  <meta property="og:title" content="Noteblock Pianola" />
  <meta property="og:description" content="🎹🍺 where everybody knows your name 🎵🎶" />

  <!-- IMPORTANT: Discord prefers absolute, cache-busted image URLs when updating -->
  <meta property="og:image" content="https://witch-craftmagazine.github.io/noteblock-pianola/musicbox.webp?v=1" />
  <meta property="og:image:secure_url" content="https://witch-craftmagazine.github.io/noteblock-pianola/musicbox.webp?v=1" />
  <meta property="og:image:type" content="image/webp" />

  <!-- Strongly recommended for Discord embed quality -->
  <meta property="og:image:width" content="2000" />
  <meta property="og:image:height" content="1138" />

  <!-- Twitter (still used by some preview fallbacks) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://witch-craftmagazine.github.io/noteblock-pianola/" />
  <meta name="twitter:title" content="Noteblock Pianola" />
  <meta name="twitter:description" content="🎹🍺 where everybody knows your name 🎵🎶" />
  <meta name="twitter:image" content="https://witch-craftmagazine.github.io/noteblock-pianola/musicbox.webp?v=1" />

  <!-- Favicon (browser tab icon only — NOT used in OG embeds) -->
  <link rel="icon" type="image/png" href="./noteblock.png" />

  <!-- Optional: helps some platforms pick a better icon -->
  <link rel="apple-touch-icon" href="./noteblock.png" />

  <!--
  Import map: teaches the browser how to resolve the bare "spessasynth_core"
  specifier used inside lib/spessasynth_lib.js.
  Must appear before any <script type="module">.
  -->
  <script type="importmap">
  {
  "imports": {
  "spessasynth_core": "./lib/spessasynth_core.js"
  }
  }
  </script>

  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>

<!-- Procedural background canvas (src/musicbox/bg-toggle.js). Sits behind
     #canvas-container. Off by default — draws only once the user opts in
     via the #bg-toggle button (top-right, mirrors #sf-toggle). -->
<canvas id="bg-canvas"></canvas>

<div id="canvas-container">
  <canvas id="three-canvas"></canvas>

  <!-- Note particle overlay -->
  <canvas id="note-canvas"></canvas>

  <!-- Minecraft skip overlay (shown when i_feel_pretty plays) -->
  <div id="mc-overlay">
    <canvas id="mc-canvas"></canvas>
  </div>

  <!-- Carrot field skip overlay (shown when dixieland_delight plays) -->
  <div id="cf-overlay">
    <canvas id="cf-canvas"></canvas>
  </div>

  <!-- Green skip overlay (shown when greensleeves plays) -->
  <div id="gr-overlay">
    <canvas id="gr-canvas"></canvas>
  </div>

  <!-- Office skip overlay (shown when the office theme plays) -->
  <div id="of-overlay">
    <canvas id="of-canvas"></canvas>
  </div>

  <!-- Lab skip overlay (shown when hip_to_be_square plays) -->
  <div id="lb-overlay">
    <canvas id="lb-canvas"></canvas>
  </div>

  <!-- Duck skip overlay (shown when peter_and_the_wolf plays) -->
  <div id="duck-overlay">
    <canvas id="duck-canvas"></canvas>
  </div>

  <div id="wind-hint">↻ Drag the crank in a clockwise circle to wind up</div>

  <div id="loading">
  <div class="spinner"></div>
  <span>Loading music box…</span>
  </div>

  <div id="error">
  <span>⚠ Could not load <code>musicbox.glb</code></span>
  <span>Make sure the file is in the same folder as this HTML file.</span>
  </div>
</div>

<!-- GitHub source flap — top-right corner, next to #bg-toggle. -->
<a id="github-flap"
   href="https://github.com/witch-craftmagazine/noteblock-pianola"
   target="_blank" rel="noopener noreferrer"
   aria-label="View source on GitHub" title="View source on GitHub">
  <span id="github-flap-label">GitHub</span>
</a>

<!-- Soundfont switcher: button in src/musicbox/soundfont-toggle.js opens a
     dropdown listing soundfonts/manifest.json entries. -->
<button id="sf-toggle" title="Change soundfont">🎼 SF</button>

<!-- Dynamic background toggle: on/off switch for the procedurally
     generated, per-song background in src/musicbox/bg-toggle.js.
     Off by default (see #bg-canvas above). -->
<button id="bg-toggle" title="Toggle dynamic background">⬜ BG</button>

<!-- Three.js scene (camera, GLB, crank/lid animation, note particles, bg toggle) -->
<!-- Bundled from src/musicbox/ via `bun run build` -- see package.json -->
<script type="module" src="./dist/main.js"></script>

<!-- Step 3: MIDI music player -->
<script type="module" src="./script.js"></script>

<!-- Easter egg overlays — add new eggs to easter-eggs/registry.json -->
<script type="module" src="./easter-eggs/egg-loader.js"></script>

</body>
