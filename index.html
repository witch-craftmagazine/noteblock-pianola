  <style>

<body>

<div id="canvas-container">
  <canvas id="three-canvas"></canvas>

  <!-- Note particle overlay -->
  <canvas id="note-canvas"></canvas>

  <div id="wind-hint">↻ Drag the crank in a clockwise circle to wind up</div>

  <div id="loading">
    <div class="spinner"></div>
    <span>Loading music box…</span>
  </div>

  <div id="error">
    <span>⚠ Could not load <code>musicbox.glb</code></span>
    <span>Make sure the file is in the same folder as this HTML file.</span>
  </div>
</div>

<!-- Goal 4b: Background toggle -->
<button id="bg-toggle" title="Toggle background">⬜ BG</button>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- OrbitControls -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
// ─────────────────────────────────────────────
//  CONFIG — tweak these values freely
// ─────────────────────────────────────────────
const CONFIG = {
  glbPath: './musicbox.glb',

  // Camera position (where it starts)
  cameraDistance: 5,
  cameraHeight: 1.5,

  // Lighting
  ambientIntensity: 0.7,
  keyLightIntensity: 1.4,
  fillLightIntensity: 0.5,
  rimLightIntensity: 0.8,

  // Crank: how many pixels of drag = one full wind revolution
  DRAG_PX_PER_REV: 120,
  // How many revolutions needed to trigger play
  WINDS_TO_PLAY: 1.5,
};

// ─────────────────────────────────────────────
//  SCENE SETUP
// ─────────────────────────────────────────────
const canvas    = document.getElementById('three-canvas');
const loading   = document.getElementById('loading');
const errorBox  = document.getElementById('error');
const container = document.getElementById('canvas-container');
const windHint  = document.getElementById('wind-hint');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputEncoding  = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.01, 100);

const cameraBaseAngle = Math.PI / 6;
camera.position.set(
  Math.sin(cameraBaseAngle) * CONFIG.cameraDistance,
  CONFIG.cameraHeight,
  Math.cos(cameraBaseAngle) * CONFIG.cameraDistance
);
camera.lookAt(0, 0.5, 0);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping    = true;
controls.dampingFactor    = 0.08;
controls.minDistance      = 2;
controls.maxDistance      = 10;
controls.maxPolarAngle    = Math.PI / 2;
controls.enabled          = false;
controls.update();

// ─────────────────────────────────────────────
//  LIGHTING
// ─────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xfff4e0, CONFIG.ambientIntensity);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xfff8ee, CONFIG.keyLightIntensity);
keyLight.position.set(-3, 5, 3);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far  = 20;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xddeeff, CONFIG.fillLightIntensity);
fillLight.position.set(4, 2, -1);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xaaddff, CONFIG.rimLightIntensity);
rimLight.position.set(0, 3, -5);
scene.add(rimLight);

// ─────────────────────────────────────────────
//  GLB LOADER
// ─────────────────────────────────────────────
async function loadGLB(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const buffer = await res.arrayBuffer();

  const view   = new DataView(buffer);
  const magic  = view.getUint32(0, true);
  if (magic !== 0x46546C67) throw new Error('Not a valid GLB file');
  const length = view.getUint32(8, true);

  let offset = 12;
  let jsonChunk = null;
  let binChunk  = null;

  while (offset < length) {
    const chunkLen  = view.getUint32(offset,     true);
    const chunkType = view.getUint32(offset + 4, true);
    const chunkData = buffer.slice(offset + 8, offset + 8 + chunkLen);
    if (chunkType === 0x4E4F534A) jsonChunk = chunkData;
    if (chunkType === 0x004E4942) binChunk  = chunkData;
    offset += 8 + chunkLen;
  }

  const json = JSON.parse(new TextDecoder().decode(jsonChunk));
  const loader = new THREE.GLTFLoader();

  return new Promise((resolve, reject) => {
    loader.parse(buffer, '', resolve, reject);
  });
}

// ─────────────────────────────────────────────
//  ANIMATION SYSTEM
// ─────────────────────────────────────────────
let mixer = null;

// Tracks whether the close animation is currently mid-play.
// Prevents open from firing before close finishes.
let _lidClosing = false;
// Tracks whether the open animation is currently mid-play.
// Used to guard lid state checks and prevent redundant open calls.
let _lidOpening = false;
// If open was requested while close was still playing, queue it.
let _openQueued = false;

window.musicBoxAnimations = {
  crank_spin: null,
  open:       null,
  close:      null,
  idle:       null,

  play(name) {
    const action = this[name];
    if (!action) {
      console.warn(`[MusicBox] ⚠ Animation '${name}' not found on mixer — check clip names in GLB.`);
      return;
    }

    const clipDuration = action.getClip().duration;
    console.log(`[MusicBox] ▶ Playing '${name}' | clip duration: ${clipDuration.toFixed(3)}s`);

    // Stop any animations that would fight the lid pose.
    // A clamped or paused action still contributes its pose to the mixer,
    // so we must fully stop() them — not just pause — before playing close/open.
    if (name === 'close') {
      if (this.open)  { console.log('[MusicBox] Stopping open before close.');  this.open.stop();  }
      if (this.idle)  { console.log('[MusicBox] Stopping idle before close.');  this.idle.stop();  }
      _lidClosing = true;
      _lidOpening = false;   // open was interrupted — clear its flag
      _openQueued = false;
    }
    if (name === 'open') {
      if (_lidClosing) {
        console.log('[MusicBox] Close still running — queuing open until it finishes.');
        _openQueued = true;
        return;
      }
      if (this.close) { console.log('[MusicBox] Stopping close before open.'); this.close.stop(); }
      _lidOpening = true;
    }

    // Three.js r128: reset() alone doesn't always re-enable a finished action.
    // Explicitly set enabled = true after reset() to guarantee it runs.
    action.stop();
    action.reset();
    action.enabled = true;
    action.clampWhenFinished = true;
    action.setLoop(THREE.LoopOnce, 1);
    action.play();

    console.log(`[MusicBox] Action '${name}' isRunning: ${action.isRunning()}, time: ${action.time.toFixed(3)}`);
  },

  setCrankSpinning(on) {
    const crank = this.crank_spin;
    const idle  = this.idle;
    if (on) {
      if (crank) {
        // Resume path: action was playing and then paused (enabled stays true, time is preserved).
        // Fresh path:  action was stopped (enabled=false) or never played — needs full reset.
        if (crank.paused && crank.enabled) {
          crank.paused = false;
          console.log('[MusicBox] crank_spin resumed from pause (position preserved).');
        } else {
          crank.reset();
          crank.enabled = true;
          crank.paused  = false;
          crank.setLoop(THREE.LoopRepeat, Infinity);
          crank.play();
          console.log('[MusicBox] crank_spin started fresh.');
        }
      }
      if (idle) {
        idle.stop();
        idle.reset();
        idle.enabled = true;
        idle.setLoop(THREE.LoopRepeat, Infinity);
        idle.play();
        console.log('[MusicBox] idle started.');
      }
    } else {
      // Pause rather than stop so the handle stays at its current pose
      // and position is preserved for the next resume.
      if (crank) { crank.paused = true;  console.log('[MusicBox] crank_spin paused (position held).'); }
      if (idle)  { idle.stop();          console.log('[MusicBox] idle stopped.'); }
    }
  },
};

// ─────────────────────────────────────────────
//  LOAD MODEL
// ─────────────────────────────────────────────
(async () => {
  try {
    const gltf = await loadGLB(CONFIG.glbPath);
    const model = gltf.scene;
    scene.add(model);

    // Center model
    const box = new THREE.Box3().setFromObject(model);
    const cen = box.getCenter(new THREE.Vector3());
    model.position.sub(cen);
    model.position.y += (box.max.y - box.min.y) / 2;

    // Shadows
    model.traverse(child => {
      if (child.isMesh) {
        child.castShadow    = true;
        child.receiveShadow = true;
      }
    });

    // Register interactive meshes
    window._registerCrankMeshes && window._registerCrankMeshes(model);
    window._registerLidMeshes   && window._registerLidMeshes(model);

    // Animations
    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(model);

      console.log('[MusicBox] Available animation clips:', gltf.animations.map(c => `"${c.name}" (${c.duration.toFixed(3)}s)`).join(', '));

      gltf.animations.forEach(clip => {
        const action = mixer.clipAction(clip);
        const key    = clip.name.toLowerCase().replace(/\s+/g, '_');
        if (window.musicBoxAnimations.hasOwnProperty(key)) {
          window.musicBoxAnimations[key] = action;
          console.log(`[MusicBox] Registered animation '${key}' -> clip "${clip.name}" (${clip.duration.toFixed(3)}s)`);
        } else {
          console.log(`[MusicBox] Skipped clip "${clip.name}" (key "${key}" not in animation map)`);
        }
      });

      // Strip lid tracks from looping animations so they can't fight open/close.
      // A looping action that includes lid keyframes holds the lid at whatever
      // pose those keyframes define, blending against and defeating close/open.
      const LID_PATTERN = /lid|top|cover/i;
      ['crank_spin', 'idle'].forEach(key => {
        const clip = window.musicBoxAnimations[key]?.getClip();
        if (!clip) return;
        const before = clip.tracks.length;
        clip.tracks = clip.tracks.filter(t => !LID_PATTERN.test(t.name));
        const removed = before - clip.tracks.length;
        if (removed > 0) {
          console.log(`[MusicBox] Stripped ${removed} lid track(s) from '${key}'.`);
        } else {
          console.log(`[MusicBox] No lid tracks found in '${key}' (pattern: ${LID_PATTERN}).`);
        }
      });
      mixer.addEventListener('finished', (e) => {
        const clipName = e.action.getClip().name;
        const key      = clipName.toLowerCase().replace(/\s+/g, '_');
        console.log(`[MusicBox] FINISHED: "${clipName}" | time: ${e.action.time.toFixed(3)}s`);

        if (key === 'close') {
          _lidClosing = false;
          console.log('[MusicBox] Lid is now fully closed and held.');
          if (_openQueued) {
            _openQueued = false;
            console.log('[MusicBox] Playing queued open animation.');
            window.musicBoxAnimations.play('open');
          }
        }

        if (key === 'open') {
          _lidOpening = false;
          // Crank spin was already started in onMusicPlay — nothing more to do here.
          // _pendingMusicStart is kept cleared so no stale state accumulates.
          window._pendingMusicStart = false;
          console.log('[MusicBox] Lid fully open. Crank should already be spinning.');
        }
      });

    } else {
      console.warn('[MusicBox] No animations found in GLB. Lid and crank will not animate.');
    }

    loading.classList.add('hidden');

    // Show wind hint
    windHint.classList.add('show');
    setTimeout(() => windHint.classList.remove('show'), 3000);

  } catch (err) {
    console.error('GLB load error:', err);
    loading.classList.add('hidden');
    errorBox.classList.add('visible');
  }
})();

// ─────────────────────────────────────────────
//  RENDER LOOP
// ─────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  // While the user is manually scrubbing the crank, pass 0 so the mixer
  // renders the current pose without advancing time and overwriting action.time.
  if (mixer) mixer.update(isDragging ? 0 : delta);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ─────────────────────────────────────────────
//  INTERACTION STATE
// ─────────────────────────────────────────────
let isDragging   = false;
let lastMouseX   = 0;
let lastMouseY   = 0;
let windAccum    = 0;
let hasPlayed    = false;
let lidOpen      = false;
let crankMeshes  = [];
let lidMeshes    = [];

// ── Raycaster for mesh hit testing ────────────
const raycaster = new THREE.Raycaster();
const mouse     = new THREE.Vector2();

function hitTest(event, meshes) {
  if (!meshes.length) return false;
  const rect = canvas.getBoundingClientRect();
  mouse.x =  ((event.clientX - rect.left)  / rect.width)  * 2 - 1;
  mouse.y = -((event.clientY - rect.top)   / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  return raycaster.intersectObjects(meshes, true).length > 0;
}

// ── Lid toggle ─────────────────────────────────
function toggleLid() {
  if (lidOpen) {
    window.musicBoxAnimations.play('close');
    lidOpen = false;
  } else {
    window.musicBoxAnimations.play('open');
    lidOpen = true;
  }
}

// ── Crank drag ────────────────────────────────
canvas.addEventListener('mousemove', e => {
  if (isDragging) {
    const dx = e.clientX - lastMouseX;
    const dy = e.clientY - lastMouseY;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;

    const action = window.musicBoxAnimations.crank_spin;
    if (action) {
      const duration  = action.getClip().duration;
      const timePerPx = duration / CONFIG.DRAG_PX_PER_REV;

      // Bug 3: accept up OR down drag on the vertical axis (abs), 
      // and left stroke on horizontal. Use dominant axis to avoid double-counting.
      const vertDelta = Math.abs(dy);
      const horizDelta = Math.max(0, -dx); // only leftward counts horizontally
      const forwardDelta = vertDelta >= Math.abs(dx) ? vertDelta : horizDelta;

      windAccum += forwardDelta;

      // Bug 2: ensure action is initialized in the mixer before scrubbing.
      // An action that was never play()'d has no mixer binding and setting
      // .time on it does nothing visible. Play+pause to register it.
      if (!action.isRunning() && !action._initialized) {
        action.reset();
        action.enabled = true;
        action.setLoop(THREE.LoopRepeat, Infinity);
        action.play();
        action.paused = true;
        action._initialized = true;
        mixer && mixer.update(0);
      }

      action.time   = (action.time + forwardDelta * timePerPx) % duration;
      action.paused = true;
      mixer && mixer.update(0);
    }

    if (window.onCrankTurn) window.onCrankTurn(dx);

  } else {
    const overCrank = hitTest(e, crankMeshes);
    const overLid   = hitTest(e, lidMeshes);
    canvas.style.cursor = overCrank ? 'grab' : (overLid ? 'pointer' : 'default');
  }
});

canvas.addEventListener('mousedown', e => {
  const overCrank = hitTest(e, crankMeshes);
  const overLid   = hitTest(e, lidMeshes);

  if (overCrank) {
    isDragging          = true;
    lastMouseX          = e.clientX;
    lastMouseY          = e.clientY;
    controls.enabled    = false;
    canvas.style.cursor = 'grabbing';
    const action = window.musicBoxAnimations.crank_spin;
    if (action) action.paused = true;
    const idleAction = window.musicBoxAnimations.idle;
    if (idleAction) idleAction.stop();
    if (window.musicPlayer && window.musicPlayer.isPlaying()) {
      window.musicPlayer.pause();
    }
    windAccum = 0;
    hasPlayed = false;
    console.log(`[MusicBox] mousedown on crank | was playing: ${window.musicPlayer?.isPlaying()} | lidOpen: ${lidOpen} | windAccum+hasPlayed reset.`);
  } else if (overLid) {
    toggleLid();
  }
});

window.addEventListener('mouseup', () => {
  if (!isDragging) return;
  isDragging          = false;
  canvas.style.cursor = 'default';

  // #1: Trigger play only when the user releases the crank, not during drag
  const windsCompleted = windAccum / CONFIG.DRAG_PX_PER_REV;
  console.log(`[MusicBox] mouseup | winds: ${windsCompleted.toFixed(2)} / ${CONFIG.WINDS_TO_PLAY} | hasPlayed: ${hasPlayed} | lidOpen: ${lidOpen} | _lidOpening: ${_lidOpening} | playing: ${window.musicPlayer?.isPlaying()}`);

  if (windsCompleted >= CONFIG.WINDS_TO_PLAY && !hasPlayed) {
    hasPlayed = true;
    console.log('[MusicBox] Wind threshold reached — calling musicPlayer.play(). Lid/crank will sync via onMusicPlay.');
    if (window.musicPlayer) window.musicPlayer.play();
  } else {
    // Do NOT call setCrankSpinning here — that is onMusicPlay's job.
    // Calling it here risks fighting the lid/crank state managed by the callbacks.
    console.log(`[MusicBox] mouseup: no action (winds ${windsCompleted.toFixed(2)} < ${CONFIG.WINDS_TO_PLAY} or hasPlayed=${hasPlayed}).`);
  }
});

// ─────────────────────────────────────────────
//  MESH REGISTRARS
// ─────────────────────────────────────────────
window._registerCrankMeshes = function(root) {
  crankMeshes = [];
  root.traverse(child => {
    if (child.name && /crank/i.test(child.name)) crankMeshes.push(child);
  });
  console.log('Crank meshes:', crankMeshes.map(m => m.name));
};

window._registerLidMeshes = function(root) {
  lidMeshes = [];
  root.traverse(child => {
    if (child.name && /lid|top|cover/i.test(child.name)) lidMeshes.push(child);
  });
  console.log('Lid meshes:', lidMeshes.map(m => m.name));
};

// ─────────────────────────────────────────────
//  MUSIC CALLBACKS — Goal 3: Lid + crank sync
// ─────────────────────────────────────────────
window.onMusicPlay = () => {
  console.log(`[MusicBox] onMusicPlay | lidOpen: ${lidOpen} | _lidOpening: ${_lidOpening} | _lidClosing: ${_lidClosing}`);

  // Open the lid if it isn't already (animation runs in parallel with music + crank).
  if (!lidOpen) {
    lidOpen = true;
    window.musicBoxAnimations.play('open');
    console.log('[MusicBox] onMusicPlay: lid was closed → opening now (parallel with music + crank).');
  } else {
    console.log('[MusicBox] onMusicPlay: lid already open.');
  }

  // Start crank immediately — don't wait for the lid animation to finish.
  // Music and crank are tightly coupled; the lid opening is a parallel flourish.
  window.musicBoxAnimations.setCrankSpinning(true);
  console.log('[MusicBox] onMusicPlay: crank spin started.');
};

window.onMusicPause = () => {
  console.log(`[MusicBox] onMusicPause | lidOpen: ${lidOpen} | _lidOpening: ${_lidOpening}`);

  // #2: Stop the crank spinning animation but leave it at its current pose
  // by pausing instead of stopping, so the handle stays put visually.
  const crank = window.musicBoxAnimations.crank_spin;
  if (crank) { crank.paused = true; }
  const idle = window.musicBoxAnimations.idle;
  if (idle)  { idle.stop(); }

  // Close lid (if open or mid-open — play('close') handles the queue guard internally).
  if (lidOpen) {
    window.musicBoxAnimations.play('close');
    lidOpen = false;
    console.log('[MusicBox] onMusicPause: closing lid.');
  }
};

// Bug #5: handled in script.js — song end now always autoplays next track.
// onMusicEnd resets local wind state so the crank is ready for the next song.
window.onMusicEnd = () => {
  console.log('[MusicBox] onMusicEnd | resetting windAccum, hasPlayed. Stopping crank. script.js will load next track and fire onMusicPlay.');
  windAccum = 0;
  hasPlayed = false;
  // Stop crank so it restarts cleanly when next song's onMusicPlay fires
  window.musicBoxAnimations.setCrankSpinning(false);
};

// ─────────────────────────────────────────────
//  RESIZE HANDLER
// ─────────────────────────────────────────────
window.addEventListener('resize', () => {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  controls.update();
  const nc = document.getElementById('note-canvas');
  if (nc) { nc.width = w; nc.height = h; }
});

// ─────────────────────────────────────────────
//  Goal 4b: Background toggle
// ─────────────────────────────────────────────
(function() {
  const btn = document.getElementById('bg-toggle');
  let bgImage = false;

  btn.addEventListener('click', () => {
    bgImage = !bgImage;
    document.body.classList.toggle('bg-image', bgImage);
    btn.textContent = bgImage ? '⬛ BG' : '⬜ BG';
  });
})();
</script>

<!-- ─────────────────────────────────────────────
     NOTE PARTICLE SYSTEM
     Goal 1: Random color tinting from palette.
     Particles drawn in a blended tint of the chosen
     color (mixed with white) so they aren't fully flat.
──────────────────────────────────────────────── -->
<script>
(function() {
  const noteCanvas = document.getElementById('note-canvas');
  const ctx        = noteCanvas.getContext('2d');

  // Match size to container
  function resizeNoteCanvas() {
    noteCanvas.width  = container.clientWidth;
    noteCanvas.height = container.clientHeight;
  }
  resizeNoteCanvas();
  window.addEventListener('resize', resizeNoteCanvas);

  // Goal 1: Color palette
  const PARTICLE_PALETTE = [
    '#77D700','#95C000','#B2A500','#CC8600','#E26500',
    '#F34100','#FC1E00','#FE000F','#F70033','#E8005A',
    '#CF0083','#AE00A9','#8600CC'
  ];

  // Parse a hex color into [r, g, b]
  function hexToRGB(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  // Blend color with white at given strength (0=white, 1=full color)
  // Returns an rgba() string respecting particle alpha
  function tintedColor(rgb, strength, alpha) {
    const r = Math.round(rgb[0] * strength + 255 * (1 - strength));
    const g = Math.round(rgb[1] * strength + 255 * (1 - strength));
    const b = Math.round(rgb[2] * strength + 255 * (1 - strength));
    return `rgba(${r},${g},${b},${alpha})`;
  }

  const NOTES_GLYPHS = ['♩','♪','♫','♬'];
  const particles    = [];
  let   isPlaying    = false;
  let   spawnTimer   = 0;

  const SPAWN_INTERVAL_MS = 400;
  const SPAWN_X_MIN = 0.3;
  const SPAWN_X_MAX = 0.7;
  const SPAWN_Y     = 0.45;

  function spawnNote() {
    const x   = (SPAWN_X_MIN + Math.random() * (SPAWN_X_MAX - SPAWN_X_MIN)) * noteCanvas.width;
    const y   = SPAWN_Y * noteCanvas.height;
    const hex = PARTICLE_PALETTE[Math.floor(Math.random() * PARTICLE_PALETTE.length)];
    particles.push({
      x,
      y,
      glyph   : NOTES_GLYPHS[Math.floor(Math.random() * NOTES_GLYPHS.length)],
      size    : 14 + Math.random() * 14,
      vx      : (Math.random() - 0.5) * 0.6,
      vy      : -(0.5 + Math.random() * 0.8),
      alpha   : 1,
      fadeRate: 0.004 + Math.random() * 0.004,
      wobble  : Math.random() * Math.PI * 2,
      wobbleAmp: 0.3 + Math.random() * 0.5,
      rgb     : hexToRGB(hex),   // Goal 1: per-particle color
    });
  }

  let lastTime = null;

  function tickNotes(timestamp) {
    requestAnimationFrame(tickNotes);

    const dt = lastTime ? timestamp - lastTime : 16;
    lastTime = timestamp;

    if (isPlaying) {
      spawnTimer += dt;
      if (spawnTimer >= SPAWN_INTERVAL_MS) {
        spawnTimer = 0;
        spawnNote();
        if (Math.random() < 0.25) spawnNote();
      }
    }

    ctx.clearRect(0, 0, noteCanvas.width, noteCanvas.height);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];

      p.wobble += 0.03;
      p.x      += p.vx + Math.sin(p.wobble) * p.wobbleAmp;
      p.y      += p.vy;
      p.alpha  -= p.fadeRate;

      if (p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.font        = `${p.size}px serif`;

      // Goal 1: fill with blended tint (65% color + 35% white = not fully saturated)
      ctx.fillStyle   = tintedColor(p.rgb, 0.65, p.alpha);

      // Goal 1: shadow glow uses the pure color for depth/contrast
      ctx.shadowColor = `rgba(${p.rgb[0]},${p.rgb[1]},${p.rgb[2]},0.7)`;
      ctx.shadowBlur  = 8;

      ctx.fillText(p.glyph, p.x, p.y);
      ctx.restore();
    }
  }

  requestAnimationFrame(tickNotes);

  // Chain onto existing music callbacks
  const _origPlay  = window.onMusicPlay;
  const _origPause = window.onMusicPause;
  const _origEnd   = window.onMusicEnd;

  window.onMusicPlay = () => {
    isPlaying = true;
    if (_origPlay) _origPlay();
  };

  window.onMusicPause = () => {
    isPlaying = false;
    if (_origPause) _origPause();
  };

  // Bug #5: when a song ends, reset state so the next song auto-starts cleanly
  window.onMusicEnd = () => {
    isPlaying = false;
    if (_origEnd) _origEnd();
  };
})();
</script>
