<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Box</title>

  <!-- Goal 4a: Favicon -->
  <link rel="icon" type="image/png" href="./noteblock.png"/>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #1a1a2e;
      transition: background 0.5s ease;
    }

    /* Goal 4b: Background webp class */
    body.bg-image {
      background: url('./background.webp') center / cover no-repeat;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* Loading overlay */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: inherit;
      color: #fff;
      font-family: monospace;
      font-size: 14px;
      letter-spacing: 0.1em;
      transition: opacity 0.6s ease;
      pointer-events: none;
      z-index: 10;
    }

    #loading.hidden { opacity: 0; }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error message */
    #error {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #ff6b6b;
      font-family: monospace;
      font-size: 13px;
      text-align: center;
      padding: 40px;
    }
    #error.visible { display: flex; }
    #error code {
      background: rgba(255,255,255,0.08);
      padding: 8px 16px;
      border-radius: 6px;
      color: #fff;
    }

    /* ── Wind-up hint toast ── */
    #wind-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20,12,8,0.82);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: #e8d5a3;
      font-family: monospace;
      font-size: 13px;
      letter-spacing: 0.07em;
      padding: 10px 20px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
      z-index: 20;
      white-space: nowrap;
    }
    #wind-hint.show { opacity: 1; }

    /* ── Note particle canvas (overlay) ── */
    #note-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* Goal 4b: Background toggle button */
    #bg-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 30;
      background: rgba(20, 12, 8, 0.75);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #e8d5a3;
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.07em;
      padding: 6px 12px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.15s;
      user-select: none;
    }
    #bg-toggle:hover { background: rgba(255,255,255,0.12); }
  </style>
</head>
<body>

<div id="canvas-container">
  <canvas id="three-canvas"></canvas>

  <!-- Note particle overlay -->
  <canvas id="note-canvas"></canvas>

  <div id="wind-hint">⟵ Drag the crank to wind up</div>

  <div id="loading">
    <div class="spinner"></div>
    <span>Loading music box…</span>
  </div>

  <div id="error">
    <span>⚠ Could not load <code>musicbox.glb</code></span>
    <span>Make sure the file is in the same folder as this HTML file.</span>
  </div>
</div>

<!-- Goal 4b: Background toggle -->
<button id="bg-toggle" title="Toggle background">⬜ BG</button>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- OrbitControls -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ─────────────────────────────────────────────
//  CONFIG — tweak these values freely
// ─────────────────────────────────────────────
const CONFIG = {
  glbPath: 'musicbox.glb',

  // Camera position (where it starts)
  cameraDistance: 5,
  cameraHeight: 1.5,

  // Lighting
  ambientIntensity: 0.7,
  keyLightIntensity: 1.4,
  fillLightIntensity: 0.5,
  rimLightIntensity: 0.8,

  // Crank: how many pixels of drag = one full wind revolution
  DRAG_PX_PER_REV: 120,
  // How many revolutions needed to trigger play
  WINDS_TO_PLAY: 1.5,
};

// ─────────────────────────────────────────────
//  SCENE SETUP
// ─────────────────────────────────────────────
const canvas    = document.getElementById('three-canvas');
const loading   = document.getElementById('loading');
const errorBox  = document.getElementById('error');
const container = document.getElementById('canvas-container');
const windHint  = document.getElementById('wind-hint');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputEncoding  = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.01, 100);

const cameraBaseAngle = Math.PI / 6;
camera.position.set(
  Math.sin(cameraBaseAngle) * CONFIG.cameraDistance,
  CONFIG.cameraHeight,
  Math.cos(cameraBaseAngle) * CONFIG.cameraDistance
);
camera.lookAt(0, 0.5, 0);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping    = true;
controls.dampingFactor    = 0.08;
controls.minDistance      = 2;
controls.maxDistance      = 10;
controls.maxPolarAngle    = Math.PI / 2;
controls.enabled          = false;
controls.update();

// ─────────────────────────────────────────────
//  LIGHTING
// ─────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xfff4e0, CONFIG.ambientIntensity);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xfff8ee, CONFIG.keyLightIntensity);
keyLight.position.set(-3, 5, 3);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far  = 20;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xddeeff, CONFIG.fillLightIntensity);
fillLight.position.set(4, 2, -1);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xaaddff, CONFIG.rimLightIntensity);
rimLight.position.set(0, 3, -5);
scene.add(rimLight);

// ─────────────────────────────────────────────
//  GLB LOADER
// ─────────────────────────────────────────────
async function loadGLB(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const buffer = await res.arrayBuffer();

  const view   = new DataView(buffer);
  const magic  = view.getUint32(0, true);
  if (magic !== 0x46546C67) throw new Error('Not a valid GLB file');
  const length = view.getUint32(8, true);

  let offset = 12;
  let jsonChunk = null;
  let binChunk  = null;

  while (offset < length) {
    const chunkLen  = view.getUint32(offset,     true);
    const chunkType = view.getUint32(offset + 4, true);
    offset += 8;
    if (chunkType === 0x4E4F534A) {
      const bytes = new Uint8Array(buffer, offset, chunkLen);
      jsonChunk   = JSON.parse(new TextDecoder().decode(bytes));
    } else if (chunkType === 0x004E4942) {
      binChunk = buffer.slice(offset, offset + chunkLen);
    }
    offset += chunkLen;
  }

  if (!jsonChunk) throw new Error('No JSON chunk in GLB');

  return new Promise((resolve, reject) => {
    if (window.THREE_GLTFLoader) {
      const loader = new window.THREE_GLTFLoader();
      loader.load(url, resolve, undefined, reject);
      return;
    }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
    s.onload = () => {
      window.THREE_GLTFLoader = THREE.GLTFLoader;
      const loader = new THREE.GLTFLoader();
      loader.load(url, resolve, undefined, reject);
    };
    s.onerror = () => reject(new Error('Could not load GLTFLoader addon'));
    document.head.appendChild(s);
  });
}

// ─────────────────────────────────────────────
//  ANIMATION STATE
// ─────────────────────────────────────────────
let mixer      = null;
let modelRoot  = null;
let clock      = new THREE.Clock();

window.musicBoxAnimations = {
  open:       null,
  close:      null,
  crank_spin: null,

  play(name) {
    const action = this[name];
    if (!action) return;

    // Use enabled=false rather than stop() on the opposing animation.
    // stop() snaps all bones back to the rest/bind pose before the new
    // clip starts, which causes the lid to jump position.
    // enabled=false zeroes the weight contribution without touching bone
    // transforms, so the incoming clip takes over from wherever the bones
    // actually are.
    const opposing = name === 'close' ? this.open : (name === 'open' ? this.close : null);
    if (opposing) opposing.enabled = false;

    action.reset();
    action.enabled = true;
    action.setLoop(THREE.LoopOnce, 1);
    action.clampWhenFinished = true;
    action.play();
  },

  setCrankSpinning(active) {
    const action = this.crank_spin;
    if (!action) return;
    if (active) {
      action.paused = false;
      action.setLoop(THREE.LoopRepeat, Infinity);
      action.play();
    } else {
      action.paused = true;
    }
  }
};

// ─────────────────────────────────────────────
//  LID STATE  — Goal 3: Fixed open/close/music sync
// ─────────────────────────────────────────────
let lidOpen   = false;
let lidMeshes = [];

function toggleLid() {
  if (lidOpen) {
    // Closing: play close anim first, then pause music
    window.musicBoxAnimations.play('close');
    lidOpen = false;
    if (window.musicPlayer && window.musicPlayer.isPlaying()) {
      window.musicPlayer.pause();   // triggers onMusicPause → stops crank
    }
  } else {
    // Opening: play open anim, then start music
    window.musicBoxAnimations.play('open');
    lidOpen = true;
    if (window.musicPlayer) {
      window.musicPlayer.play();    // triggers onMusicPlay → starts crank
    }
  }
}

// ─────────────────────────────────────────────
//  LOAD MODEL
// ─────────────────────────────────────────────
loadGLB(CONFIG.glbPath).then(gltf => {
  modelRoot = gltf.scene;

  const box    = new THREE.Box3().setFromObject(modelRoot);
  const size   = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale  = 2.0 / maxDim;

  modelRoot.scale.setScalar(scale);
  modelRoot.position.sub(centre.multiplyScalar(scale));
  modelRoot.position.y += size.y * scale * 0.5;

  modelRoot.traverse(child => {
    if (child.isMesh) {
      child.castShadow    = true;
      child.receiveShadow = true;
      if (child.material.map) {
        child.material.map.magFilter = THREE.NearestFilter;
        child.material.map.minFilter = THREE.NearestFilter;
      }
    }
  });

  scene.add(modelRoot);

  // Register crank & lid meshes
  window._registerCrankMeshes(modelRoot);
  window._registerLidMeshes(modelRoot);

  // Set up animation mixer
  if (gltf.animations && gltf.animations.length > 0) {
    mixer = new THREE.AnimationMixer(modelRoot);

    gltf.animations.forEach(clip => {
      const action = mixer.clipAction(clip);
      const key    = clip.name.toLowerCase().replace(/[\s-]/g, '_');

      if (key === 'open')             window.musicBoxAnimations.open       = action;
      else if (key === 'close')       window.musicBoxAnimations.close      = action;
      else if (key.includes('crank')) {
        window.musicBoxAnimations.crank_spin = action;
        action.setLoop(THREE.LoopRepeat, Infinity);
        action.play();
        action.paused = true;
      }
    });

    console.log('Animations loaded:', gltf.animations.map(a => a.name));
  }

  loading.classList.add('hidden');

  // Show wind-up hint briefly
  windHint.classList.add('show');
  setTimeout(() => windHint.classList.remove('show'), 3500);

  animate();

}).catch(err => {
  console.error('GLB load error:', err);
  loading.classList.add('hidden');
  errorBox.classList.add('visible');
});

// ─────────────────────────────────────────────
//  RENDER LOOP
// ─────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if (mixer) mixer.update(delta);
  controls.update();
  renderer.render(scene, camera);
}

// ─────────────────────────────────────────────
//  RAYCASTING HELPERS
// ─────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
let crankMeshes = [];
let isDragging  = false;
let lastMouseX  = 0;

// Crank winding accumulator
let windAccum   = 0;
let hasPlayed   = false;

canvas.style.cursor = 'default';

function getMouseNDC(e) {
  const rect = canvas.getBoundingClientRect();
  return new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width)  *  2 - 1,
    ((e.clientY - rect.top)  / rect.height) * -2 + 1
  );
}

function hitTest(e, meshes) {
  if (!meshes.length) return false;
  raycaster.setFromCamera(getMouseNDC(e), camera);
  return raycaster.intersectObjects(meshes, true).length > 0;
}

// ── Crank drag ────────────────────────────────
canvas.addEventListener('mousemove', e => {
  if (isDragging) {
    const dx   = e.clientX - lastMouseX;
    lastMouseX = e.clientX;

    const action = window.musicBoxAnimations.crank_spin;
    if (action) {
      const duration  = action.getClip().duration;
      const timePerPx = duration / CONFIG.DRAG_PX_PER_REV;
      const forwardDx = Math.max(0, -dx);
      windAccum += forwardDx;
      action.time   = (action.time + forwardDx * timePerPx) % duration;
      action.paused = true;
      mixer && mixer.update(0);
    }

    if (window.onCrankTurn) window.onCrankTurn(dx);

    const windsCompleted = windAccum / CONFIG.DRAG_PX_PER_REV;
    if (windsCompleted >= CONFIG.WINDS_TO_PLAY && !hasPlayed) {
      hasPlayed = true;
      if (window.musicPlayer) window.musicPlayer.play();
    }

  } else {
    const overCrank = hitTest(e, crankMeshes);
    const overLid   = hitTest(e, lidMeshes);
    canvas.style.cursor = overCrank ? 'grab' : (overLid ? 'pointer' : 'default');
  }
});

canvas.addEventListener('mousedown', e => {
  const overCrank = hitTest(e, crankMeshes);
  const overLid   = hitTest(e, lidMeshes);

  if (overCrank) {
    isDragging           = true;
    lastMouseX           = e.clientX;
    controls.enabled     = false;
    canvas.style.cursor  = 'grabbing';
    const action = window.musicBoxAnimations.crank_spin;
    if (action) action.paused = true;
    // Pause music on grab so user must re-wind to play
    if (window.musicPlayer && window.musicPlayer.isPlaying()) {
      window.musicPlayer.pause();
    }
    // Reset wind accumulator so user has to wind from scratch
    windAccum = 0;
    hasPlayed = false;
  } else if (overLid) {
    toggleLid();
  }
});

window.addEventListener('mouseup', () => {
  if (!isDragging) return;
  isDragging          = false;
  canvas.style.cursor = 'default';

  if (window.musicPlayer && window.musicPlayer.isPlaying()) {
    window.musicBoxAnimations.setCrankSpinning(true);
  }
});

// ─────────────────────────────────────────────
//  MESH REGISTRARS
// ─────────────────────────────────────────────
window._registerCrankMeshes = function(root) {
  crankMeshes = [];
  root.traverse(child => {
    if (child.name && /crank/i.test(child.name)) crankMeshes.push(child);
  });
  console.log('Crank meshes:', crankMeshes.map(m => m.name));
};

window._registerLidMeshes = function(root) {
  lidMeshes = [];
  root.traverse(child => {
    if (child.name && /lid|top|cover/i.test(child.name)) lidMeshes.push(child);
  });
  console.log('Lid meshes:', lidMeshes.map(m => m.name));
};

// ─────────────────────────────────────────────
//  MUSIC CALLBACKS — Goal 3: Lid + crank sync
// ─────────────────────────────────────────────
window.onMusicPlay = () => {
  window.musicBoxAnimations.setCrankSpinning(true);
  // Open lid if still closed (e.g. player play button pressed directly)
  if (!lidOpen) {
    window.musicBoxAnimations.play('open');
    lidOpen = true;
  }
};

window.onMusicPause = () => {
  window.musicBoxAnimations.setCrankSpinning(false);
  windAccum = 0;
  hasPlayed = false;
  // Close lid if still open
  if (lidOpen) {
    window.musicBoxAnimations.play('close');
    lidOpen = false;
  }
};

// ─────────────────────────────────────────────
//  RESIZE HANDLER
// ─────────────────────────────────────────────
window.addEventListener('resize', () => {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  controls.update();
  const nc = document.getElementById('note-canvas');
  if (nc) { nc.width = w; nc.height = h; }
});

// ─────────────────────────────────────────────
//  Goal 4b: Background toggle
// ─────────────────────────────────────────────
(function() {
  const btn = document.getElementById('bg-toggle');
  let bgImage = false;

  btn.addEventListener('click', () => {
    bgImage = !bgImage;
    document.body.classList.toggle('bg-image', bgImage);
    btn.textContent = bgImage ? '⬛ BG' : '⬜ BG';
  });
})();
</script>

<!-- ─────────────────────────────────────────────
     NOTE PARTICLE SYSTEM
     Goal 1: Random color tinting from palette.
     Particles drawn in a blended tint of the chosen
     color (mixed with white) so they aren't fully flat.
──────────────────────────────────────────────── -->
<script>
(function() {
  const noteCanvas = document.getElementById('note-canvas');
  const ctx        = noteCanvas.getContext('2d');

  // Match size to container
  function resizeNoteCanvas() {
    noteCanvas.width  = container.clientWidth;
    noteCanvas.height = container.clientHeight;
  }
  resizeNoteCanvas();
  window.addEventListener('resize', resizeNoteCanvas);

  // Goal 1: Color palette
  const PARTICLE_PALETTE = [
    '#77D700','#95C000','#B2A500','#CC8600','#E26500',
    '#F34100','#FC1E00','#FE000F','#F70033','#E8005A',
    '#CF0083','#AE00A9','#8600CC'
  ];

  // Parse a hex color into [r, g, b]
  function hexToRGB(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  // Blend color with white at given strength (0=white, 1=full color)
  // Returns an rgba() string respecting particle alpha
  function tintedColor(rgb, strength, alpha) {
    const r = Math.round(rgb[0] * strength + 255 * (1 - strength));
    const g = Math.round(rgb[1] * strength + 255 * (1 - strength));
    const b = Math.round(rgb[2] * strength + 255 * (1 - strength));
    return `rgba(${r},${g},${b},${alpha})`;
  }

  const NOTES_GLYPHS = ['♩','♪','♫','♬'];
  const particles    = [];
  let   isPlaying    = false;
  let   spawnTimer   = 0;

  const SPAWN_INTERVAL_MS = 400;
  const SPAWN_X_MIN = 0.3;
  const SPAWN_X_MAX = 0.7;
  const SPAWN_Y     = 0.45;

  function spawnNote() {
    const x   = (SPAWN_X_MIN + Math.random() * (SPAWN_X_MAX - SPAWN_X_MIN)) * noteCanvas.width;
    const y   = SPAWN_Y * noteCanvas.height;
    const hex = PARTICLE_PALETTE[Math.floor(Math.random() * PARTICLE_PALETTE.length)];
    particles.push({
      x,
      y,
      glyph   : NOTES_GLYPHS[Math.floor(Math.random() * NOTES_GLYPHS.length)],
      size    : 14 + Math.random() * 14,
      vx      : (Math.random() - 0.5) * 0.6,
      vy      : -(0.5 + Math.random() * 0.8),
      alpha   : 1,
      fadeRate: 0.004 + Math.random() * 0.004,
      wobble  : Math.random() * Math.PI * 2,
      wobbleAmp: 0.3 + Math.random() * 0.5,
      rgb     : hexToRGB(hex),   // Goal 1: per-particle color
    });
  }

  let lastTime = null;

  function tickNotes(timestamp) {
    requestAnimationFrame(tickNotes);

    const dt = lastTime ? timestamp - lastTime : 16;
    lastTime = timestamp;

    if (isPlaying) {
      spawnTimer += dt;
      if (spawnTimer >= SPAWN_INTERVAL_MS) {
        spawnTimer = 0;
        spawnNote();
        if (Math.random() < 0.25) spawnNote();
      }
    }

    ctx.clearRect(0, 0, noteCanvas.width, noteCanvas.height);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];

      p.wobble += 0.03;
      p.x      += p.vx + Math.sin(p.wobble) * p.wobbleAmp;
      p.y      += p.vy;
      p.alpha  -= p.fadeRate;

      if (p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.font        = `${p.size}px serif`;

      // Goal 1: fill with blended tint (65% color + 35% white = not fully saturated)
      ctx.fillStyle   = tintedColor(p.rgb, 0.65, p.alpha);

      // Goal 1: shadow glow uses the pure color for depth/contrast
      ctx.shadowColor = `rgba(${p.rgb[0]},${p.rgb[1]},${p.rgb[2]},0.7)`;
      ctx.shadowBlur  = 8;

      ctx.fillText(p.glyph, p.x, p.y);
      ctx.restore();
    }
  }

  requestAnimationFrame(tickNotes);

  // Chain onto existing music callbacks
  const _origPlay  = window.onMusicPlay;
  const _origPause = window.onMusicPause;

  window.onMusicPlay = () => {
    isPlaying = true;
    if (_origPlay) _origPlay();
  };

  window.onMusicPause = () => {
    isPlaying = false;
    if (_origPause) _origPause();
  };
})();
</script>

<!-- Step 3: MIDI music player -->
<script type="module" src="./script.js"></script>

</body>
</html>
