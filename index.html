<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Box</title>

  <!-- Goal 4a: Favicon -->
  <link rel="icon" type="image/png" href="./noteblock.png"/>

  <!--
    Import map: teaches the browser how to resolve the bare "spessasynth_core"
    specifier used inside lib/spessasynth_lib.js.
    Must appear before any <script type="module">.
  -->
  <script type="importmap">
  {
    "imports": {
      "spessasynth_core": "./lib/spessasynth_core.js"
    }
  }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #1a1a2e;
      transition: background 0.5s ease;
    }

    /* Goal 4b: Background webp class */
    body.bg-image {
      background: url('./background.webp') center / cover no-repeat;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* Loading overlay */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: inherit;
      color: #fff;
      font-family: monospace;
      font-size: 14px;
      letter-spacing: 0.1em;
      transition: opacity 0.6s ease;
      pointer-events: none;
      z-index: 10;
    }

    #loading.hidden { opacity: 0; }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error message */
    #error {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #ff6b6b;
      font-family: monospace;
      font-size: 13px;
      text-align: center;
      padding: 40px;
    }
    #error.visible { display: flex; }
    #error code {
      background: rgba(255,255,255,0.08);
      padding: 8px 16px;
      border-radius: 6px;
      color: #fff;
    }

    /* ── Wind-up hint toast ── */
    #wind-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20,12,8,0.82);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: #e8d5a3;
      font-family: monospace;
      font-size: 13px;
      letter-spacing: 0.07em;
      padding: 10px 20px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
      z-index: 20;
      white-space: nowrap;
    }
    #wind-hint.show { opacity: 1; }

    /* ── Note particle canvas (overlay) ── */
    #note-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* Goal 4b: Background toggle button */
    #bg-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 30;
      background: rgba(20, 12, 8, 0.75);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #e8d5a3;
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.07em;
      padding: 6px 12px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.15s;
      user-select: none;
    }
    #bg-toggle:hover { background: rgba(255,255,255,0.12); }
  </style>
</head>
<body>

<div id="canvas-container">
  <canvas id="three-canvas"></canvas>

  <!-- Note particle overlay -->
  <canvas id="note-canvas"></canvas>

  <div id="wind-hint">⟵ Drag the crank to wind up</div>

  <div id="loading">
    <div class="spinner"></div>
    <span>Loading music box…</span>
  </div>

  <div id="error">
    <span>⚠ Could not load <code>musicbox.glb</code></span>
    <span>Make sure the file is in the same folder as this HTML file.</span>
  </div>
</div>

<!-- Goal 4b: Background toggle -->
<button id="bg-toggle" title="Toggle background">⬜ BG</button>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- OrbitControls -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
// ─────────────────────────────────────────────
//  CONFIG — tweak these values freely
// ─────────────────────────────────────────────
const CONFIG = {
  glbPath: './musicbox.glb',

  // Camera position (where it starts)
  cameraDistance: 5,
  cameraHeight: 1.5,

  // Lighting
  ambientIntensity: 0.7,
  keyLightIntensity: 1.4,
  fillLightIntensity: 0.5,
  rimLightIntensity: 0.8,

  // Crank: how many pixels of drag = one full wind revolution
  DRAG_PX_PER_REV: 120,
  // How many revolutions needed to trigger play
  WINDS_TO_PLAY: 1.5,
};

// ─────────────────────────────────────────────
//  SCENE SETUP
// ─────────────────────────────────────────────
const canvas    = document.getElementById('three-canvas');
const loading   = document.getElementById('loading');
const errorBox  = document.getElementById('error');
const container = document.getElementById('canvas-container');
const windHint  = document.getElementById('wind-hint');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputEncoding  = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.01, 100);

const cameraBaseAngle = Math.PI / 6;
camera.position.set(
  Math.sin(cameraBaseAngle) * CONFIG.cameraDistance,
  CONFIG.cameraHeight,
  Math.cos(cameraBaseAngle) * CONFIG.cameraDistance
);
camera.lookAt(0, 0.5, 0);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping    = true;
controls.dampingFactor    = 0.08;
controls.minDistance      = 2;
controls.maxDistance      = 10;
controls.maxPolarAngle    = Math.PI / 2;
controls.enabled          = false;
controls.update();

// ─────────────────────────────────────────────
//  LIGHTING
// ─────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xfff4e0, CONFIG.ambientIntensity);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xfff8ee, CONFIG.keyLightIntensity);
keyLight.position.set(-3, 5, 3);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far  = 20;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xddeeff, CONFIG.fillLightIntensity);
fillLight.position.set(4, 2, -1);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xaaddff, CONFIG.rimLightIntensity);
rimLight.position.set(0, 3, -5);
scene.add(rimLight);

// ─────────────────────────────────────────────
//  GLB LOADER
// ─────────────────────────────────────────────
async function loadGLB(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const buffer = await res.arrayBuffer();

  const view   = new DataView(buffer);
  const magic  = view.getUint32(0, true);
  if (magic !== 0x46546C67) throw new Error('Not a valid GLB file');
  const length = view.getUint32(8, true);

  let offset = 12;
  let jsonChunk = null;
  let binChunk  = null;

  while (offset < length) {
    const chunkLen  = view.getUint32(offset,     true);
    const chunkType = view.getUint32(offset + 4, true);
    const chunkData = buffer.slice(offset + 8, offset + 8 + chunkLen);
    if (chunkType === 0x4E4F534A) jsonChunk = chunkData;
    if (chunkType === 0x004E4942) binChunk  = chunkData;
    offset += 8 + chunkLen;
  }

  const json = JSON.parse(new TextDecoder().decode(jsonChunk));
  const loader = new THREE.GLTFLoader();

  return new Promise((resolve, reject) => {
    loader.parse(buffer, '', resolve, reject);
  });
}

// ─────────────────────────────────────────────
//  ANIMATION SYSTEM
// ─────────────────────────────────────────────
let mixer = null;
window.musicBoxAnimations = {
  crank_spin: null,
  open:       null,
  close:      null,

  play(name) {
    const action = this[name];
    if (!action) return;
    action.reset();
    action.clampWhenFinished = true;
    action.setLoop(THREE.LoopOnce, 1);
    action.play();
  },

  setCrankSpinning(on) {
    const action = this.crank_spin;
    if (!action) return;
    if (on) {
      action.paused = false;
      action.setLoop(THREE.LoopRepeat, Infinity);
      action.play();
    } else {
      action.paused = true;
    }
  },
};

// ─────────────────────────────────────────────
//  LOAD MODEL
// ─────────────────────────────────────────────
(async () => {
  try {
    const gltf = await loadGLB(CONFIG.glbPath);
    const model = gltf.scene;
    scene.add(model);

    // Center model
    const box = new THREE.Box3().setFromObject(model);
    const cen = box.getCenter(new THREE.Vector3());
    model.position.sub(cen);
    model.position.y += (box.max.y - box.min.y) / 2;

    // Shadows
    model.traverse(child => {
      if (child.isMesh) {
        child.castShadow    = true;
        child.receiveShadow = true;
      }
    });

    // Register interactive meshes
    window._registerCrankMeshes && window._registerCrankMeshes(model);
    window._registerLidMeshes   && window._registerLidMeshes(model);

    // Animations
    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(model);
      gltf.animations.forEach(clip => {
        const action = mixer.clipAction(clip);
        const key    = clip.name.toLowerCase().replace(/\s+/g, '_');
        if (window.musicBoxAnimations.hasOwnProperty(key)) {
          window.musicBoxAnimations[key] = action;
        }
      });
    }

    loading.classList.add('hidden');

    // Show wind hint
    windHint.classList.add('show');
    setTimeout(() => windHint.classList.remove('show'), 3000);

  } catch (err) {
    console.error('GLB load error:', err);
    loading.classList.add('hidden');
    errorBox.classList.add('visible');
  }
})();

// ─────────────────────────────────────────────
//  RENDER LOOP
// ─────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ─────────────────────────────────────────────
//  INTERACTION STATE
// ─────────────────────────────────────────────
let isDragging  = false;
let lastMouseX  = 0;
let windAccum   = 0;
let hasPlayed   = false;
let lidOpen     = false;
let crankMeshes = [];
let lidMeshes   = [];

// ── Raycaster for mesh hit testing ────────────
const raycaster = new THREE.Raycaster();
const mouse     = new THREE.Vector2();

function hitTest(event, meshes) {
  if (!meshes.length) return false;
  const rect = canvas.getBoundingClientRect();
  mouse.x =  ((event.clientX - rect.left)  / rect.width)  * 2 - 1;
  mouse.y = -((event.clientY - rect.top)   / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  return raycaster.intersectObjects(meshes, true).length > 0;
}

// ── Lid toggle ─────────────────────────────────
function toggleLid() {
  if (lidOpen) {
    window.musicBoxAnimations.play('close');
    lidOpen = false;
  } else {
    window.musicBoxAnimations.play('open');
    lidOpen = true;
  }
}

// ── Crank drag ────────────────────────────────
canvas.addEventListener('mousemove', e => {
  if (isDragging) {
    const dx   = e.clientX - lastMouseX;
    lastMouseX = e.clientX;

    const action = window.musicBoxAnimations.crank_spin;
    if (action) {
      const duration  = action.getClip().duration;
      const timePerPx = duration / CONFIG.DRAG_PX_PER_REV;
      const forwardDx = Math.max(0, -dx);
      windAccum += forwardDx;
      action.time   = (action.time + forwardDx * timePerPx) % duration;
      action.paused = true;
      mixer && mixer.update(0);
    }

    if (window.onCrankTurn) window.onCrankTurn(dx);

    const windsCompleted = windAccum / CONFIG.DRAG_PX_PER_REV;
    if (windsCompleted >= CONFIG.WINDS_TO_PLAY && !hasPlayed) {
      hasPlayed = true;
      if (window.musicPlayer) window.musicPlayer.play();
    }

  } else {
    const overCrank = hitTest(e, crankMeshes);
    const overLid   = hitTest(e, lidMeshes);
    canvas.style.cursor = overCrank ? 'grab' : (overLid ? 'pointer' : 'default');
  }
});

canvas.addEventListener('mousedown', e => {
  const overCrank = hitTest(e, crankMeshes);
  const overLid   = hitTest(e, lidMeshes);

  if (overCrank) {
    isDragging           = true;
    lastMouseX           = e.clientX;
    controls.enabled     = false;
    canvas.style.cursor  = 'grabbing';
    const action = window.musicBoxAnimations.crank_spin;
    if (action) action.paused = true;
    // Pause music on grab so user must re-wind to play
    if (window.musicPlayer && window.musicPlayer.isPlaying()) {
      window.musicPlayer.pause();
    }
    // Reset wind accumulator so user has to wind from scratch
    windAccum = 0;
    hasPlayed = false;
  } else if (overLid) {
    toggleLid();
  }
});

window.addEventListener('mouseup', () => {
  if (!isDragging) return;
  isDragging          = false;
  canvas.style.cursor = 'default';

  if (window.musicPlayer && window.musicPlayer.isPlaying()) {
    window.musicBoxAnimations.setCrankSpinning(true);
  }
});

// ─────────────────────────────────────────────
//  MESH REGISTRARS
// ─────────────────────────────────────────────
window._registerCrankMeshes = function(root) {
  crankMeshes = [];
  root.traverse(child => {
    if (child.name && /crank/i.test(child.name)) crankMeshes.push(child);
  });
  console.log('Crank meshes:', crankMeshes.map(m => m.name));
};

window._registerLidMeshes = function(root) {
  lidMeshes = [];
  root.traverse(child => {
    if (child.name && /lid|top|cover/i.test(child.name)) lidMeshes.push(child);
  });
  console.log('Lid meshes:', lidMeshes.map(m => m.name));
};

// ─────────────────────────────────────────────
//  MUSIC CALLBACKS — Goal 3: Lid + crank sync
// ─────────────────────────────────────────────
window.onMusicPlay = () => {
  window.musicBoxAnimations.setCrankSpinning(true);
  // Open lid if still closed (e.g. player play button pressed directly)
  if (!lidOpen) {
    window.musicBoxAnimations.play('open');
    lidOpen = true;
  }
};

window.onMusicPause = () => {
  window.musicBoxAnimations.setCrankSpinning(false);
  windAccum = 0;
  hasPlayed = false;
  // Close lid if still open
  if (lidOpen) {
    window.musicBoxAnimations.play('close');
    lidOpen = false;
  }
};

// ─────────────────────────────────────────────
//  RESIZE HANDLER
// ─────────────────────────────────────────────
window.addEventListener('resize', () => {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  controls.update();
  const nc = document.getElementById('note-canvas');
  if (nc) { nc.width = w; nc.height = h; }
});

// ─────────────────────────────────────────────
//  Goal 4b: Background toggle
// ─────────────────────────────────────────────
(function() {
  const btn = document.getElementById('bg-toggle');
  let bgImage = false;

  btn.addEventListener('click', () => {
    bgImage = !bgImage;
    document.body.classList.toggle('bg-image', bgImage);
    btn.textContent = bgImage ? '⬛ BG' : '⬜ BG';
  });
})();
</script>

<!-- ─────────────────────────────────────────────
     NOTE PARTICLE SYSTEM
     Goal 1: Random color tinting from palette.
     Particles drawn in a blended tint of the chosen
     color (mixed with white) so they aren't fully flat.
──────────────────────────────────────────────── -->
<script>
(function() {
  const noteCanvas = document.getElementById('note-canvas');
  const ctx        = noteCanvas.getContext('2d');

  // Match size to container
  function resizeNoteCanvas() {
    noteCanvas.width  = container.clientWidth;
    noteCanvas.height = container.clientHeight;
  }
  resizeNoteCanvas();
  window.addEventListener('resize', resizeNoteCanvas);

  // Goal 1: Color palette
  const PARTICLE_PALETTE = [
    '#77D700','#95C000','#B2A500','#CC8600','#E26500',
    '#F34100','#FC1E00','#FE000F','#F70033','#E8005A',
    '#CF0083','#AE00A9','#8600CC'
  ];

  // Parse a hex color into [r, g, b]
  function hexToRGB(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  // Blend color with white at given strength (0=white, 1=full color)
  // Returns an rgba() string respecting particle alpha
  function tintedColor(rgb, strength, alpha) {
    const r = Math.round(rgb[0] * strength + 255 * (1 - strength));
    const g = Math.round(rgb[1] * strength + 255 * (1 - strength));
    const b = Math.round(rgb[2] * strength + 255 * (1 - strength));
    return `rgba(${r},${g},${b},${alpha})`;
  }

  const NOTES_GLYPHS = ['♩','♪','♫','♬'];
  const particles    = [];
  let   isPlaying    = false;
  let   spawnTimer   = 0;

  const SPAWN_INTERVAL_MS = 400;
  const SPAWN_X_MIN = 0.3;
  const SPAWN_X_MAX = 0.7;
  const SPAWN_Y     = 0.45;

  function spawnNote() {
    const x   = (SPAWN_X_MIN + Math.random() * (SPAWN_X_MAX - SPAWN_X_MIN)) * noteCanvas.width;
    const y   = SPAWN_Y * noteCanvas.height;
    const hex = PARTICLE_PALETTE[Math.floor(Math.random() * PARTICLE_PALETTE.length)];
    particles.push({
      x,
      y,
      glyph   : NOTES_GLYPHS[Math.floor(Math.random() * NOTES_GLYPHS.length)],
      size    : 14 + Math.random() * 14,
      vx      : (Math.random() - 0.5) * 0.6,
      vy      : -(0.5 + Math.random() * 0.8),
      alpha   : 1,
      fadeRate: 0.004 + Math.random() * 0.004,
      wobble  : Math.random() * Math.PI * 2,
      wobbleAmp: 0.3 + Math.random() * 0.5,
      rgb     : hexToRGB(hex),   // Goal 1: per-particle color
    });
  }

  let lastTime = null;

  function tickNotes(timestamp) {
    requestAnimationFrame(tickNotes);

    const dt = lastTime ? timestamp - lastTime : 16;
    lastTime = timestamp;

    if (isPlaying) {
      spawnTimer += dt;
      if (spawnTimer >= SPAWN_INTERVAL_MS) {
        spawnTimer = 0;
        spawnNote();
        if (Math.random() < 0.25) spawnNote();
      }
    }

    ctx.clearRect(0, 0, noteCanvas.width, noteCanvas.height);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];

      p.wobble += 0.03;
      p.x      += p.vx + Math.sin(p.wobble) * p.wobbleAmp;
      p.y      += p.vy;
      p.alpha  -= p.fadeRate;

      if (p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.font        = `${p.size}px serif`;

      // Goal 1: fill with blended tint (65% color + 35% white = not fully saturated)
      ctx.fillStyle   = tintedColor(p.rgb, 0.65, p.alpha);

      // Goal 1: shadow glow uses the pure color for depth/contrast
      ctx.shadowColor = `rgba(${p.rgb[0]},${p.rgb[1]},${p.rgb[2]},0.7)`;
      ctx.shadowBlur  = 8;

      ctx.fillText(p.glyph, p.x, p.y);
      ctx.restore();
    }
  }

  requestAnimationFrame(tickNotes);

  // Chain onto existing music callbacks
  const _origPlay  = window.onMusicPlay;
  const _origPause = window.onMusicPause;

  window.onMusicPlay = () => {
    isPlaying = true;
    if (_origPlay) _origPlay();
  };

  window.onMusicPause = () => {
    isPlaying = false;
    if (_origPause) _origPause();
  };
})();
</script>

<!-- Step 3: MIDI music player -->
<script type="module" src="./script.js"></script>

</body>
</html>
