<!-- Goal 4b: Background toggle -->
<button id="bg-toggle" title="Toggle background">⬜ BG</button>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
// ─────────────────────────────────────────────
//  CONFIG — tweak these values freely
// ─────────────────────────────────────────────
const CONFIG = {
  glbPath: './musicbox.glb',

  // Camera position (where it starts)
  cameraDistance: 5,
  cameraHeight: 1.5,

  // Lighting
  ambientIntensity: 0.7,
  keyLightIntensity: 1.4,
  fillLightIntensity: 0.5,
  rimLightIntensity: 0.8,

  // Crank: how many pixels of drag = one full wind revolution
  DRAG_PX_PER_REV: 120,
  // How many revolutions needed to trigger play
  WINDS_TO_PLAY: 1.5,
};

// ─────────────────────────────────────────────
//  SCENE SETUP
// ─────────────────────────────────────────────
const canvas  = document.getElementById('three-canvas');
const loading  = document.getElementById('loading');
const errorBox  = document.getElementById('error');
const container = document.getElementById('canvas-container');
const windHint  = document.getElementById('wind-hint');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputEncoding  = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type  = THREE.PCFSoftShadowMap;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.01, 100);

const cameraBaseAngle = Math.PI / 6;
camera.position.set(
  Math.sin(cameraBaseAngle) * CONFIG.cameraDistance,
  CONFIG.cameraHeight,
  Math.cos(cameraBaseAngle) * CONFIG.cameraDistance
);
camera.lookAt(0, 0.5, 0);

// ─────────────────────────────────────────────
//  LIGHTING
// ─────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xfff4e0, CONFIG.ambientIntensity);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xfff8ee, CONFIG.keyLightIntensity);
keyLight.position.set(-3, 5, 3);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far  = 20;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xddeeff, CONFIG.fillLightIntensity);
fillLight.position.set(4, 2, -1);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xaaddff, CONFIG.rimLightIntensity);
rimLight.position.set(0, 3, -5);
scene.add(rimLight);

// ─────────────────────────────────────────────
//  GLB LOADER
// ─────────────────────────────────────────────
async function loadGLB(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const buffer = await res.arrayBuffer();

  if (new DataView(buffer).getUint32(0, true) !== 0x46546C67) throw new Error('Not a valid GLB file');

  const loader = new THREE.GLTFLoader();

  return new Promise((resolve, reject) => {
  loader.parse(buffer, '', resolve, reject);
  });
}

// ─────────────────────────────────────────────
//  ANIMATION SYSTEM
// ─────────────────────────────────────────────
let mixer = null;

// Tracks whether the close animation is currently mid-play.
// Prevents open from firing before close finishes.
let _lidClosing = false;
// Tracks whether the open animation is currently mid-play.
// Used to guard lid state checks and prevent redundant open calls.
let _lidOpening = false;
// If open was requested while close was still playing, queue it.
let _openQueued = false;

window.musicBoxAnimations = {
  crank_spin: null,
  open:  null,
  close:  null,
  idle:  null,

  play(name) {
  const action = this[name];
  if (!action) {
  console.warn(`[MusicBox] ⚠ Animation '${name}' not found on mixer — check clip names in GLB.`);
  return;
  }

  const clipDuration = action.getClip().duration;

  // Stop any animations that would fight the lid pose.
  // A clamped or paused action still contributes its pose to the mixer,
  // so we must fully stop() them — not just pause — before playing close/open.
  if (name === 'close') {
  if (this.open)  { this.open.stop();  }
  if (this.idle)  { this.idle.stop();  }
  _lidClosing = true;
  _lidOpening = false;  // open was interrupted — clear its flag
  _openQueued = false;
  }
  if (name === 'open') {
  if (_lidClosing) {
  _openQueued = true;
  return;
  }
  if (this.close) { this.close.stop(); }
  _lidOpening = true;
  }


  // Three.js r128: reset() alone doesn't always re-enable a finished action.
  // Explicitly set enabled = true after reset() to guarantee it runs.
  action.stop();
  action.reset();
  action.enabled = true;
  action.clampWhenFinished = true;
  action.setLoop(THREE.LoopOnce, 1);
  action.play();

  },

  setCrankSpinning(on) {
  const crank = this.crank_spin;
  const idle  = this.idle;
  if (on) {
  if (crank) {
  // Resume path: action was playing and then paused (enabled stays true, time is preserved).
  // Fresh path:  action was stopped (enabled=false) or never played — needs full reset.
  if (crank.paused && crank.enabled) {
  crank.paused = false;
  } else {
  crank.reset();
  crank.enabled = true;
  crank.paused  = false;
  crank.setLoop(THREE.LoopRepeat, Infinity);
  crank.play();
  }
  }
  if (idle) {
  idle.stop();
  idle.reset();
  idle.enabled = true;
  idle.setLoop(THREE.LoopRepeat, Infinity);
  idle.play();
  }
  } else {
  // Pause rather than stop so the handle stays at its current pose
  // and position is preserved for the next resume.
  if (crank) { crank.paused = true; }
  if (idle)  { idle.stop(); }
  }
  },
};

// ─────────────────────────────────────────────
//  LOAD MODEL
// ─────────────────────────────────────────────
(async () => {
  try {
  const gltf = await loadGLB(CONFIG.glbPath);
  const model = gltf.scene;
  scene.add(model);

  // Center model
  const box = new THREE.Box3().setFromObject(model);
  const cen = box.getCenter(new THREE.Vector3());
  model.position.sub(cen);
  model.position.y += (box.max.y - box.min.y) / 2;

  // Shadows
  model.traverse(child => {
  if (child.isMesh) {
  child.castShadow  = true;
  child.receiveShadow = true;
  }
  });

  // Register interactive meshes
  window._registerCrankMeshes && window._registerCrankMeshes(model);
  window._registerLidMeshes  && window._registerLidMeshes(model);

  // Animations
  if (gltf.animations && gltf.animations.length > 0) {
  mixer = new THREE.AnimationMixer(model);

  gltf.animations.forEach(clip => {
  const action = mixer.clipAction(clip);
  const key  = clip.name.toLowerCase().replace(/\s+/g, '_');
  if (window.musicBoxAnimations.hasOwnProperty(key)) {
  window.musicBoxAnimations[key] = action;
  }
  });

  // Strip lid tracks from looping animations so they can't fight open/close.
  // A looping action that includes lid keyframes holds the lid at whatever
  // pose those keyframes define, blending against and defeating close/open.
  const LID_PATTERN = /lid|top|cover/i;
  ['crank_spin', 'idle'].forEach(key => {
  const clip = window.musicBoxAnimations[key]?.getClip();
  if (!clip) return;
  const before = clip.tracks.length;
  clip.tracks = clip.tracks.filter(t => !LID_PATTERN.test(t.name));
  });
  mixer.addEventListener('finished', (e) => {
  const clipName = e.action.getClip().name;
  const key  = clipName.toLowerCase().replace(/\s+/g, '_');

  if (key === 'close') {
  _lidClosing = false;
  if (_openQueued) {
  _openQueued = false;
  window.musicBoxAnimations.play('open');
  }
  }

  if (key === 'open') {
  _lidOpening = false;
  // Crank spin was already started in onMusicPlay — nothing more to do here.
  }
  });

  } else {
  console.warn('[MusicBox] No animations found in GLB. Lid and crank will not animate.');
  }

  loading.classList.add('hidden');

  // Show wind hint
  windHint.classList.add('show');
  setTimeout(() => windHint.classList.remove('show'), 3000);

  } catch (err) {
  console.error('GLB load error:', err);
  loading.classList.add('hidden');
  errorBox.classList.add('visible');
  }
})();

// ─────────────────────────────────────────────
//  RENDER LOOP
// ─────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  // While the user is manually scrubbing the crank, pass 0 so the mixer
  // renders the current pose without advancing time and overwriting action.time.
  if (mixer) mixer.update(isDragging ? 0 : delta);
  renderer.render(scene, camera);
}
animate();

// ─────────────────────────────────────────────
//  INTERACTION STATE
// ─────────────────────────────────────────────
let isDragging  = false;
let lastMouseX  = 0;
let lastMouseY  = 0;
let windAccum  = 0;
let hasPlayed  = false;
let lidOpen  = false;
let crankMeshes  = [];
let lidMeshes  = [];

// Tracks which AnimationActions have been initialized in the mixer
// (avoids using non-standard properties on Three.js objects).
const _initializedActions = new WeakSet();

// ── Raycaster for mesh hit testing ────────────
const raycaster = new THREE.Raycaster();
const mouse  = new THREE.Vector2();

function hitTest(event, meshes) {
  if (!meshes.length) return false;
  const rect = canvas.getBoundingClientRect();
  mouse.x =  ((event.clientX - rect.left)  / rect.width)  * 2 - 1;
  mouse.y = -((event.clientY - rect.top)  / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  return raycaster.intersectObjects(meshes, true).length > 0;
}

// ── Lid toggle ─────────────────────────────────
function toggleLid() {
  if (lidOpen) {
  window.musicBoxAnimations.play('close');
  lidOpen = false;
  } else {
  window.musicBoxAnimations.play('open');
  lidOpen = true;
  }
}


// ─────────────────────────────────────────────
//  INTERACTION — Pointer Events (mouse + touch + stylus)
//
//  P1: Using the Pointer Events API instead of mouse-only events means
//  the crank drag works correctly on touchscreens without any extra code.
//  pointer capture keeps the drag live even if the finger leaves the canvas.
//  touch-action: none (set in CSS) prevents the browser hijacking the touch
//  for scrolling while a drag is in progress.
// ─────────────────────────────────────────────

canvas.style.touchAction = 'none'; // prevent browser scroll hijack during drag

canvas.addEventListener('pointermove', e => {
  if (isDragging) {
    const dx = e.clientX - lastMouseX;
    const dy = e.clientY - lastMouseY;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;

    const action = window.musicBoxAnimations.crank_spin;
    if (action) {
      const duration  = action.getClip().duration;
      const timePerPx = duration / CONFIG.DRAG_PX_PER_REV;

      const vertDelta  = Math.abs(dy);
      const horizDelta = Math.max(0, -dx);
      const forwardDelta = vertDelta >= Math.abs(dx) ? vertDelta : horizDelta;

      windAccum += forwardDelta;

      if (!action.isRunning() && !_initializedActions.has(action)) {
        action.reset();
        action.enabled = true;
        action.setLoop(THREE.LoopRepeat, Infinity);
        action.play();
        action.paused = true;
        _initializedActions.add(action);
        mixer && mixer.update(0);
      }

      action.time   = (action.time + forwardDelta * timePerPx) % duration;
      action.paused = true;
      mixer && mixer.update(0);
    }
  } else {
    // Only update cursor on non-touch pointers — touch has no visible cursor
    if (e.pointerType !== 'touch') {
      const overCrank = hitTest(e, crankMeshes);
      const overLid   = hitTest(e, lidMeshes);
      canvas.style.cursor = overCrank ? 'grab' : (overLid ? 'pointer' : 'default');
    }
  }
});

canvas.addEventListener('pointerdown', e => {
  const overCrank = hitTest(e, crankMeshes);
  const overLid   = hitTest(e, lidMeshes);

  if (overCrank) {
    // Capture the pointer so pointermove keeps firing even if finger
    // leaves the canvas element bounds during a fast drag.
    canvas.setPointerCapture(e.pointerId);

    isDragging  = true;
    lastMouseX  = e.clientX;
    lastMouseY  = e.clientY;
    if (e.pointerType !== 'touch') canvas.style.cursor = 'grabbing';

    const action = window.musicBoxAnimations.crank_spin;
    if (action) action.paused = true;
    const idleAction = window.musicBoxAnimations.idle;
    if (idleAction) idleAction.stop();
    if (window.musicPlayer && window.musicPlayer.isPlaying()) {
      window.musicPlayer.pause();
    }
    windAccum = 0;
    hasPlayed = false;
  } else if (overLid) {
    toggleLid();
  }
});

window.addEventListener('pointerup', e => {
  if (!isDragging) return;
  isDragging = false;
  if (e.pointerType !== 'touch') canvas.style.cursor = 'default';

  const windsCompleted = windAccum / CONFIG.DRAG_PX_PER_REV;
  if (windsCompleted >= CONFIG.WINDS_TO_PLAY && !hasPlayed) {
    hasPlayed = true;
    if (window.musicPlayer) window.musicPlayer.play();
  }
});






window._registerCrankMeshes = function(root) {
  crankMeshes = [];
  root.traverse(child => {
  if (child.name && /crank/i.test(child.name)) crankMeshes.push(child);
  });
};

window._registerLidMeshes = function(root) {
  lidMeshes = [];
  root.traverse(child => {
  if (child.name && /lid|top|cover/i.test(child.name)) lidMeshes.push(child);
  });
};

// ─────────────────────────────────────────────
//  MUSIC CALLBACKS — Goal 3: Lid + crank sync
// ─────────────────────────────────────────────
window.onMusicPlay = () => {

  // Open the lid if it isn't already (animation runs in parallel with music + crank).
  if (!lidOpen) {
  lidOpen = true;
  window.musicBoxAnimations.play('open');
  }

  // Start crank immediately — don't wait for the lid animation to finish.
  // Music and crank are tightly coupled; the lid opening is a parallel flourish.
  window.musicBoxAnimations.setCrankSpinning(true);
};

window.onMusicPause = () => {

  // #2: Stop the crank spinning animation but leave it at its current pose
  // by pausing instead of stopping, so the handle stays put visually.
  const crank = window.musicBoxAnimations.crank_spin;
  if (crank) { crank.paused = true; }
  const idle = window.musicBoxAnimations.idle;
  if (idle)  { idle.stop(); }

  // Close lid (if open or mid-open — play('close') handles the queue guard internally).
  if (lidOpen) {
  window.musicBoxAnimations.play('close');
  lidOpen = false;
  }
};

// Bug #5: handled in script.js — song end now always autoplays next track.
// onMusicEnd resets local wind state so the crank is ready for the next song.
window.onMusicEnd = () => {
  windAccum = 0;
  hasPlayed = false;
  // Stop crank so it restarts cleanly when next song's onMusicPlay fires
  window.musicBoxAnimations.setCrankSpinning(false);
};

// ─────────────────────────────────────────────
//  RESIZE HANDLER
// ─────────────────────────────────────────────
window.addEventListener('resize', () => {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// ─────────────────────────────────────────────
//  Goal 4b: Background toggle
// ─────────────────────────────────────────────
(function() {
  const btn = document.getElementById('bg-toggle');
  let bgImage = false;

  btn.addEventListener('click', () => {
  bgImage = !bgImage;
  document.body.classList.toggle('bg-image', bgImage);
  btn.textContent = bgImage ? '⬛ BG' : '⬜ BG';
  });
})();
</script>

<!-- ─────────────────────────────────────────────
  NOTE PARTICLE SYSTEM
  P9: Minecraft-style note particles.
  Pitch (0–24) maps to a full HSV hue sweep exactly as Minecraft does.
  Sprite is a grayscale note texture tinted per-particle via canvas compositing.
  Falls back to text glyph if the sprite hasn't loaded yet.
──────────────────────────────────────────────── -->
<script>
(function() {
  const noteCanvas = document.getElementById('note-canvas');
  const ctx = noteCanvas.getContext('2d');

  function resizeNoteCanvas() {
    noteCanvas.width  = container.clientWidth;
    noteCanvas.height = container.clientHeight;
  }
  resizeNoteCanvas();
  window.addEventListener('resize', resizeNoteCanvas);

  // ── P9: Minecraft pitch→color mapping ────────────────────────────
  // Minecraft maps note block pitch (0–24) to a full HSV hue rotation.
  // hue = (pitch / 24) * 360 degrees, S=1, V=1 → fully saturated rainbow.
  // We use pitch % 25 to wrap any MIDI note (0–127) into the 0–24 range.
  function pitchToRGB(pitch) {
    const hue = ((pitch % 25) / 24) * 360;
    const h = hue / 60;
    const i = Math.floor(h);
    const f = h - i;
    const q = 1 - f;
    const t = f;
    const table = [
      [1, t, 0], [q, 1, 0], [0, 1, t],
      [0, q, 1], [t, 0, 1], [1, 0, q]
    ];
    const [r, g, b] = table[i % 6];
    return [Math.round(r * 255), Math.round(g * 255), Math.round(b * 255)];
  }

  // ── Sprite loading ─────────────────────────────────────────────
  // The sprite should be a small grayscale PNG (white note on transparent bg).
  // Color is applied once per hue bucket below (not per particle per frame) —
  // the sprite itself must be white/grey, not colored.
  const SPRITE_PATH = './textures/note_particle.png';
  let noteSprite = null;

  // Cache of pre-tinted flat sprites, one per hue bucket, built once when the
  // base sprite loads. Avoids the old per-particle/per-frame multi-pass
  // composite (drawImage x3 + fillRect + shadowBlur), which is the main cost
  // that was making this overlay heavy.
  const TINT_BUCKETS = 25; // matches the 0–24 pitch range
  const TINT_SIZE     = 32; // baked at a fixed size; canvas drawImage scales it cheaply
  let tintedSprites = null;

  function buildTintedSprites(img) {
    tintedSprites = [];
    for (let i = 0; i < TINT_BUCKETS; i++) {
      const [r, g, b] = pitchToRGB(i);
      const c = document.createElement('canvas');
      c.width = TINT_SIZE; c.height = TINT_SIZE;
      const tctx = c.getContext('2d');

      tctx.drawImage(img, 0, 0, TINT_SIZE, TINT_SIZE);
      tctx.globalCompositeOperation = 'multiply';
      tctx.fillStyle = `rgb(${r},${g},${b})`;
      tctx.fillRect(0, 0, TINT_SIZE, TINT_SIZE);
      tctx.globalCompositeOperation = 'destination-in';
      tctx.drawImage(img, 0, 0, TINT_SIZE, TINT_SIZE);

      tintedSprites.push(c);
    }
  }

  const spriteImg = new Image();
  spriteImg.onload = () => { noteSprite = spriteImg; buildTintedSprites(spriteImg); };
  spriteImg.onerror = () => {
    console.warn('[Particles] note_particle.png not found — using text glyph fallback');
  };
  spriteImg.src = SPRITE_PATH;

  // ── Fallback text glyphs (used if sprite not loaded) ──────────
  const NOTES_GLYPHS = ['♩','♪','♫','♬'];

  const particles = [];
  let isPlaying   = false;
  let spawnTimer  = 0;

  const SPAWN_INTERVAL_MS = 220;
  const SPAWN_X_MIN = 0.25;
  const SPAWN_X_MAX = 0.75;
  const SPAWN_Y     = 0.55;
  const MAX_PARTICLES = 28; // hard cap so a slow frame can't snowball into more work

  // If SpessaSynth exposes a per-note callback, wire it here to get real pitch data.
  // Until then, we pick a random pitch for each particle — still produces the full
  // Minecraft rainbow, just without pitch correlation to the actual notes playing.
  function spawnNote(pitch) {
    if (particles.length >= MAX_PARTICLES) return;
    const usePitch = (pitch !== undefined) ? pitch : Math.floor(Math.random() * 25);
    const x = (SPAWN_X_MIN + Math.random() * (SPAWN_X_MAX - SPAWN_X_MIN)) * noteCanvas.width;
    const y = SPAWN_Y * noteCanvas.height;
    particles.push({
      x,
      y,
      pitch    : usePitch,
      rgb      : pitchToRGB(usePitch),
      glyph    : NOTES_GLYPHS[Math.floor(Math.random() * NOTES_GLYPHS.length)],
      size     : 14 + Math.random() * 12,  // flatter/smaller than before
      vx       : (Math.random() - 0.5) * 0.7,
      vy       : -(0.9 + Math.random() * 1.2),
      alpha    : 1,
      fadeRate : 0.012 + Math.random() * 0.01, // fades several x faster — fewer concurrent particles
      wobble   : Math.random() * Math.PI * 2,
      wobbleAmp: 0.4 + Math.random() * 0.6,
    });
  }

  // ── Tinted sprite draw ──────────────────────────────────────────
  // Single drawImage of a pre-tinted bucket sprite. No per-frame compositing,
  // no shadowBlur — "flatter" by design, and an order of magnitude cheaper.
  function drawTintedSprite(p) {
    const s = p.size;
    const bucket = tintedSprites[p.pitch % TINT_BUCKETS];
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.drawImage(bucket, p.x - s / 2, p.y - s / 2, s, s);
  }

  // ── Text glyph fallback draw ────────────────────────────────────
  // No shadowBlur here either — flat fill only.
  function drawGlyphFallback(p) {
    const [r, g, b] = p.rgb;
    const tr = Math.round(r * 0.65 + 255 * 0.35);
    const tg = Math.round(g * 0.65 + 255 * 0.35);
    const tb = Math.round(b * 0.65 + 255 * 0.35);

    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.font        = `${p.size}px serif`;
    ctx.fillStyle   = `rgb(${tr},${tg},${tb})`;
    ctx.fillText(p.glyph, p.x, p.y);
  }

  let lastTime = null;
  const MAX_DT = 50; // ms — clamp so a slow/backgrounded frame can't fling particles

  function tickNotes(timestamp) {
    requestAnimationFrame(tickNotes);

    let dt = lastTime ? timestamp - lastTime : 16;
    dt = Math.min(dt, MAX_DT);
    lastTime = timestamp;
    const dtScale = dt / 16; // normalize motion/fade to ~60fps-equivalent steps

    if (isPlaying) {
      spawnTimer += dt;
      if (spawnTimer >= SPAWN_INTERVAL_MS) {
        spawnTimer = 0;
        spawnNote();
        if (Math.random() < 0.5) spawnNote();
        if (Math.random() < 0.2) spawnNote();
      }
    }

    ctx.clearRect(0, 0, noteCanvas.width, noteCanvas.height);
    ctx.save();

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.wobble += 0.03 * dtScale;
      p.x      += (p.vx + Math.sin(p.wobble) * p.wobbleAmp) * dtScale;
      p.y      += p.vy * dtScale;
      p.alpha  -= p.fadeRate * dtScale;

      if (p.alpha <= 0) { particles.splice(i, 1); continue; }

      if (noteSprite && tintedSprites) {
        drawTintedSprite(p);
      } else {
        drawGlyphFallback(p);
      }
    }

    ctx.restore();
  }

  requestAnimationFrame(tickNotes);

  // ── Music callback chain ────────────────────────────────────────
  const _origPlay  = window.onMusicPlay;
  const _origPause = window.onMusicPause;
  const _origEnd   = window.onMusicEnd;

  window.onMusicPlay = () => {
    isPlaying = true;
    if (_origPlay) _origPlay();
  };
  window.onMusicPause = () => {
    isPlaying = false;
    if (_origPause) _origPause();
  };
  window.onMusicEnd = () => {
    isPlaying = false;
    if (_origEnd) _origEnd();
  };

  // Expose spawnNote globally so future systems (e.g. SpessaSynth note-on
  // callback) can pass a real pitch value: window._spawnNoteParticle(pitch)
  window._spawnNoteParticle = spawnNote;
})();
</script>
