name: Release IPA and Publish AltStore Source

# Two ways in, same shape as the Nectar project's release.yml:
#   - workflow_dispatch: full build -> attach unsigned IPA to a release
#     -> publish appstore/source.json.
#   - release (edited): re-runs just publish-source (no rebuild) so that
#     hand-editing a release's notes on GitHub after the dispatch run
#     already published source.json still reaches the AltStore source.
#
# Unlike Nectar, this repo does NOT keep a separate gh-pages branch --
# static.yml deploys the whole repo (path: '.') from main. Because pushes
# made by GITHUB_TOKEN do not trigger other workflows, release.yml
# finishes by invoking static.yml via workflow_call to deploy the fresh
# appstore/source.json directly to GitHub Pages.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/attach the IPA to (e.g. v1.0.0)"
        required: true
        type: string
  release:
    types: [edited]

permissions:
  contents: write

jobs:
  build-ipa-release:
    name: Build and Release Unsigned IPA
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    outputs:
      tag: ${{ inputs.tag }}
      marketing_version: ${{ steps.archive.outputs.marketing_version }}
      build_version: ${{ steps.archive.outputs.build_version }}
      min_os_version: ${{ steps.archive.outputs.min_os_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        # Pins the same Xcode that generates the project (xcodegen reads
        # the active toolchain's project-format version) and the one that
        # builds it. Without this, xcodegen can emit a pbxproj in a format
        # newer than whatever Xcode happens to be active by default on the
        # runner, and xcodebuild then fails with "future Xcode project
        # file format" -- macos-14 hit this because its default Xcode
        # lagged xcodegen's output format. Mirrors the Nectar project's
        # release.yml, which hit the same issue.
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - uses: oven-sh/setup-bun@v2

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the web app
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Stage web assets into the iOS shell
        run: |
          mkdir -p noteblock-pianola-ios-shell/web
          rsync -a \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'song/' \
            --exclude 'noteblock-pianola-ios-shell/' \
            ./ noteblock-pianola-ios-shell/web/

      - name: Generate Xcode project
        working-directory: noteblock-pianola-ios-shell
        run: xcodegen generate

      - name: Archive (unsigned)
        id: archive
        shell: bash
        working-directory: noteblock-pianola-ios-shell
        run: |
          set -euo pipefail

          archive_path="${RUNNER_TEMP}/NoteblockPianola.xcarchive"
          rm -rf "$archive_path"

          # Suffix CURRENT_PROJECT_VERSION with the run number so the
          # buildVersion embedded in this ipa matches what publish-source
          # writes to appstore/source.json -- AltStore refuses to install
          # if they disagree. Mirrors Nectar's release.yml.
          base_project_version=$(xcodebuild -showBuildSettings \
            -project NoteblockPianola.xcodeproj \
            -scheme NoteblockPianola \
            -destination "generic/platform=iOS" \
            | grep -m1 '^\s*CURRENT_PROJECT_VERSION' | awk -F'= ' '{print $2}')
          build_version="${base_project_version}.${GITHUB_RUN_NUMBER}"

          marketing_version="${{ inputs.tag }}"
          marketing_version="${marketing_version#v}"

          min_os_version=$(xcodebuild -showBuildSettings \
            -project NoteblockPianola.xcodeproj \
            -scheme NoteblockPianola \
            -destination "generic/platform=iOS" \
            | grep -m1 '^\s*IPHONEOS_DEPLOYMENT_TARGET' | awk -F'= ' '{print $2}')

          echo "marketing_version=$marketing_version" >> "$GITHUB_OUTPUT"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "min_os_version=$min_os_version" >> "$GITHUB_OUTPUT"

          set -o pipefail
          xcodebuild \
            -project NoteblockPianola.xcodeproj \
            -scheme NoteblockPianola \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$build_version" \
            MARKETING_VERSION="$marketing_version" \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            archive

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          archive_path="${RUNNER_TEMP}/NoteblockPianola.xcarchive"
          payload_dir="${RUNNER_TEMP}/Payload"
          ipa_path="${RUNNER_TEMP}/NoteblockPianola-unsigned.ipa"

          app_path=$(find "$archive_path/Products/Applications" -maxdepth 1 -name "*.app" | head -n1)
          if [ -z "$app_path" ]; then
            echo "No .app found in archive products" >&2
            exit 1
          fi

          rm -rf "$payload_dir" "$ipa_path"
          mkdir -p "$payload_dir"
          cp -R "$app_path" "$payload_dir/"

          (cd "${RUNNER_TEMP}" && zip -qr "$(basename "$ipa_path")" "Payload")

          mkdir -p build-output
          cp "$ipa_path" build-output/

          echo "IPA_PATH=build-output/NoteblockPianola-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: noteblock-pianola-unsigned-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach IPA to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${{ inputs.tag }}"

          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$IPA_PATH" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" "$IPA_PATH" \
              --repo "${{ github.repository }}" \
              --title "$tag" \
              --generate-notes
          fi

  publish-source:
    name: Publish appstore/source.json
    needs: build-ipa-release
    # Same always()-plus-explicit-check pattern as Nectar's release.yml:
    # needed so a `release: edited` run isn't skipped just because
    # build-ipa-release's own `if` only allows workflow_dispatch, while a
    # workflow_dispatch run still won't proceed past a failed build.
    if: always() && (github.event_name == 'release' || needs.build-ipa-release.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.commit.outputs.published }}
    steps:
      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "release" ]; then
            tag_name="${{ github.event.release.tag_name }}"
          else
            tag_name="${{ needs.build-ipa-release.outputs.tag }}"
          fi
          release_json=$(gh api "repos/${{ github.repository }}/releases/tags/$tag_name")
          release_id=$(echo "$release_json" | jq -r '.id')
          published_at=$(echo "$release_json" | jq -r '.published_at')
          body=$(echo "$release_json" | jq -r '.body // ""')

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"
          {
            echo "body<<RELEASE_BODY_EOF"
            echo "$body"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # Explicit ref: for the `release` (edited) trigger, github.ref is
          # the release's own tag, not main. This job always reads/writes
          # appstore/ on main.
          ref: main

      - name: Resolve version info
        id: version_info
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "release" ]; then
            tag_name="${{ steps.release.outputs.tag_name }}"
            marketing_version="${tag_name#v}"
            min_os_version="15.0"

            # For an edited release, read the existing buildVersion already recorded
            # in source.json for this marketing version so we don't mint a new build
            # version that disagrees with the previously packaged IPA.
            existing_bv=""
            if [ -f appstore/source.json ]; then
              existing_bv=$(jq -r --arg v "$marketing_version" '
                .apps[]? | .versions[]? | select(.version == $v) | .buildVersion
              ' appstore/source.json | head -n1)
            fi

            if [ -n "$existing_bv" ] && [ "$existing_bv" != "null" ]; then
              build_version="$existing_bv"
            else
              build_version="1.${GITHUB_RUN_NUMBER}"
            fi
          else
            marketing_version="${{ needs.build-ipa-release.outputs.marketing_version }}"
            build_version="${{ needs.build-ipa-release.outputs.build_version }}"
            min_os_version="${{ needs.build-ipa-release.outputs.min_os_version }}"
          fi

          echo "marketing_version=$marketing_version" >> "$GITHUB_OUTPUT"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "min_os_version=$min_os_version" >> "$GITHUB_OUTPUT"

      - name: Find IPA release asset
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          asset_json=$(gh api "repos/${{ github.repository }}/releases/${{ steps.release.outputs.release_id }}/assets" \
            --jq '[.[] | select(.name | endswith(".ipa"))][0]')

          if [ -z "$asset_json" ] || [ "$asset_json" = "null" ]; then
            echo "No .ipa asset found on release ${{ steps.release.outputs.tag_name }}" >&2
            exit 1
          fi

          download_url=$(echo "$asset_json" | jq -r '.browser_download_url')
          size=$(echo "$asset_json" | jq -r '.size')

          echo "download_url=$download_url" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

      - name: Check icon is present
        run: |
          set -euo pipefail
          if [ ! -f appstore/icon.png ]; then
            echo "::error::appstore/icon.png is missing -- add and commit it before publishing a source." >&2
            exit 1
          fi

      - name: Merge new version into appstore/source.json
        shell: bash
        run: |
          set -euo pipefail

          existing_arg=""
          if [ -f appstore/source.json ]; then
            existing_arg="--existing=appstore/source.json"
          fi

          python3 scripts/update_source.py \
            --template=appstore/source.template.json \
            $existing_arg \
            --output=appstore/source.json \
            --version="${{ steps.version_info.outputs.marketing_version }}" \
            --build-version="${{ steps.version_info.outputs.build_version }}" \
            --date="${{ steps.release.outputs.published_at }}" \
            --notes="${{ steps.release.outputs.body }}" \
            --download-url="${{ steps.asset.outputs.download_url }}" \
            --size-bytes="${{ steps.asset.outputs.size }}" \
            --min-os-version="${{ steps.version_info.outputs.min_os_version }}"

      - name: Commit and push source.json
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appstore/source.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Publish ${{ steps.release.outputs.tag_name }} to appstore/source.json"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: publish-source
    if: always() && needs.publish-source.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/static.yml
