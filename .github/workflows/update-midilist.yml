# .github/workflows/update-midilist.yml
#
# Runs the full song pipeline whenever MIDI files are added, renamed,
# or removed in the midi/ folder on main.
#
# Flow:
#   1. Push to main touches midi/**
#   2. name.py                 — normalizes filenames, rewrites midilist.json
#   3. rebuild-midilist.js     — ensures midilist.json is in sync with midi/
#   4. generate-share-pages.js — regenerates per-song OG preview pages
#   5. analyze-loudness.js     — updates volumeAdjustments.json (incremental)
#   6. Auto-commits all changed files back to main
#   7. static.yml picks up the commit and deploys to GitHub Pages

name: Update midilist and share pages

on:
  push:
    branches: ["main"]
    paths:
      - "midi/**"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Needs write access to push the auto-commit back to main.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install mido

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Normalize filenames and regenerate midilist.json
        # Exits with code 1 if filename collisions are found.
        # The workflow will fail and show the collision details in the log.
        run: python scripts/name.py

      - name: Rebuild midilist.json (verify in sync with midi/)
        run: node tools/rebuild-midilist.js

      - name: Generate per-song share pages
        run: node tools/generate-share-pages.js

      - name: Analyze loudness and update volumeAdjustments.json
        # Incremental — only processes tracks not already in volumeAdjustments.json.
        # minecraft3.sf2 is checked into the repo so this runs without any extra setup.
        run: node tools/analyze-loudness.js

      - name: Commit updated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update midilist, share pages, loudness"
          file_pattern: "midilist.json midi/** song/** volumeAdjustments.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
