# .github/workflows/update-midilist.yml
#
# Regenerates midilist.json whenever MIDI files are added, renamed,
# or removed in the midi/ folder on main.
#
# Flow:
#   1. Push to main touches midi/**
#   2. This workflow runs name.py (normalizes filenames + rewrites midilist.json)
#   3. If midilist.json changed, auto-commits it back to main
#   4. The static.yml deploy workflow then picks up the commit and deploys

name: Update midilist.json

on:
  push:
    branches: ["main"]
    paths:
      - "midi/**"
  # Allow manual trigger from the Actions tab (useful for fixing a broken list)
  workflow_dispatch:

# Needs write access to push the auto-commit back to main.
# Scoped only to this workflow — does not affect static.yml.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch with the token so the auto-commit step can push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install mido

      - name: Run name.py
        # Exits with code 1 if filename collisions are found.
        # The workflow will fail and show the collision details in the log.
        run: python scripts/name.py

      - name: Commit updated midilist.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate midilist.json"
          # Only commit these files — don't accidentally sweep up anything else
          file_pattern: "midilist.json midi/**"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
